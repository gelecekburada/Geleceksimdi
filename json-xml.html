<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAForge AI - JSON ↔ XML Converter</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #172033;
      --heading: #101828;
      --muted: #667085;
      --border: #e4e7ec;
      --surface: #ffffff;
      --background: #f6f8fc;
      --danger: #b42318;
      --success: #16a34a;
      --warn: #b54708;
      --shadow-md: 0 12px 35px rgba(16,24,40,.08);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.07), transparent 32%),
        var(--background);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 16px 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: -.5px;
      color: var(--heading);
    }

    .hero p {
      margin: 0 0 24px;
      color: var(--muted);
      max-width: 760px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      padding: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      align-items: end;
      margin-bottom: 18px;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .segmented button {
      border: 0;
      background: #fff;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--primary);
      color: #fff;
    }

    label.field {
      display: grid;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    label.field select,
    label.field input[type="text"] {
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fff;
    }

    label.check {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      font-size: 14px;
      color: var(--text);
    }

    .panes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .pane h2 {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--heading);
    }

    textarea {
      width: 100%;
      min-height: 360px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      background: #fbfcfe;
      resize: vertical;
      tab-size: 2;
    }

    textarea[readonly] { background: #f4f6fa; }

    textarea:focus-visible,
    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(37,99,235,.35);
      outline-offset: 1px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      height: 42px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover { background: #f3f6fd; }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn.primary:hover { background: var(--primary-dark); }

    .status {
      margin-top: 14px;
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    .warnings {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--warn);
    }

    details.rules {
      margin-top: 18px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    details.rules summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--heading);
    }

    details.rules ul {
      margin: 10px 0 0;
      padding-left: 20px;
      font-size: 14px;
      color: var(--text);
    }

    code {
      background: #eef2f9;
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 12.5px;
    }

    @media (max-width: 800px) {
      .panes { grid-template-columns: 1fr; }
      textarea { min-height: 240px; }
      .actions .btn { flex: 1 1 140px; }
    }
  </style>
</head>

<body>

<main>

  <section class="hero">
    <h1 id="title">JSON ↔ XML Converter</h1>
    <p id="subtitle"></p>
  </section>

  <section class="card">

    <div class="toolbar">

      <div class="segmented" role="group" id="dirGroup">
        <button type="button" id="dirJ2X" aria-pressed="true">JSON → XML</button>
        <button type="button" id="dirX2J" aria-pressed="false">XML → JSON</button>
      </div>

      <label class="field">
        <span id="indentLabel">Indent</span>
        <select id="indent">
          <option value="2" id="indent2">2 spaces</option>
          <option value="4" id="indent4">4 spaces</option>
          <option value="tab" id="indentTab">Tab</option>
          <option value="0" id="indent0">None (compact)</option>
        </select>
      </label>

      <label class="field" id="rootField">
        <span id="rootLabel">Root element name</span>
        <input type="text" id="rootName" value="root" maxlength="60" />
      </label>

      <label class="check" id="declField">
        <input type="checkbox" id="declaration" checked />
        <span id="declLabel">Add XML declaration</span>
      </label>

    </div>

    <div class="panes">

      <div class="pane">
        <h2 id="inputTitle">Input</h2>
        <textarea id="input" spellcheck="false" autocomplete="off" aria-label="Input"></textarea>
      </div>

      <div class="pane">
        <h2 id="outputTitle">Output</h2>
        <textarea id="output" spellcheck="false" readonly aria-label="Output"></textarea>
      </div>

    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="convertButton">Convert</button>
      <button type="button" class="btn" id="swapButton">Swap</button>
      <button type="button" class="btn" id="copyButton">Copy output</button>
      <button type="button" class="btn" id="downloadButton">Download</button>
      <button type="button" class="btn" id="sampleButton">Load sample</button>
      <button type="button" class="btn" id="clearButton">Clear</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
    <ul class="warnings" id="warnings"></ul>

  </section>

  <details class="rules" id="rules">
    <summary id="rulesTitle">Conversion rules</summary>
    <ul id="rulesList"></ul>
  </details>

</main>

<script src="/core/json-xml.js"></script>
<script src="/core/history.js"></script>

<script>
(function () {
  "use strict";

  var lang = "en";
  try {
    lang = localStorage.getItem("baforge-language") === "tr" ? "tr" : "en";
  } catch (e) {}

  var TEXT = {
    en: {
      subtitle: "Convert between JSON and XML right in your browser. Nothing you paste is sent to a server.",
      indent: "Indent", indent2: "2 spaces", indent4: "4 spaces", indentTab: "Tab", indent0: "None (compact)",
      root: "Root element name", decl: "Add XML declaration",
      input: "Input", output: "Output",
      convert: "Convert", swap: "Swap", copy: "Copy output", download: "Download",
      sample: "Load sample", clear: "Clear",
      copied: "Copied to clipboard.", copyFail: "Could not copy. Select the output and copy it manually.",
      nothing: "There is no output yet.",
      done: "Converted.", chars: "characters",
      emptyIn: "Paste something to convert first.",
      rulesTitle: "Conversion rules",
      rules: [
        "XML attributes are written as JSON keys that start with <code>@</code>, for example <code>\"@id\": \"7\"</code>.",
        "Text next to attributes or child elements is stored under <code>\"#text\"</code>.",
        "Repeated sibling elements become a JSON array, and arrays become repeated elements.",
        "An empty element becomes <code>null</code> and <code>null</code> becomes an empty element.",
        "XML values stay text. <code>&lt;age&gt;36&lt;/age&gt;</code> becomes <code>\"36\"</code>, numbers are not guessed.",
        "A JSON object with one key uses it as the root element. Otherwise the root element name above is used.",
        "Comments and processing instructions in XML are ignored. CDATA is kept as text.",
        "Keys that are not valid XML names are repaired (for example spaces become <code>_</code>) and a warning is shown."
      ],
      pageTitle: "BAForge AI - JSON ↔ XML Converter",
      historyLabel: function (d) { return (d.direction === "j2x" ? "JSON → XML: " : "XML → JSON: ") + d.input; }
    },
    tr: {
      subtitle: "JSON ve XML arasında doğrudan tarayıcınızda dönüştürme yapın. Yapıştırdığınız hiçbir şey sunucuya gönderilmez.",
      indent: "Girinti", indent2: "2 boşluk", indent4: "4 boşluk", indentTab: "Sekme (Tab)", indent0: "Yok (sıkışık)",
      root: "Kök eleman adı", decl: "XML bildirimi ekle",
      input: "Girdi", output: "Çıktı",
      convert: "Dönüştür", swap: "Yer değiştir", copy: "Çıktıyı kopyala", download: "İndir",
      sample: "Örnek yükle", clear: "Temizle",
      copied: "Panoya kopyalandı.", copyFail: "Kopyalanamadı. Çıktıyı seçip elle kopyalayın.",
      nothing: "Henüz çıktı yok.",
      done: "Dönüştürüldü.", chars: "karakter",
      emptyIn: "Önce dönüştürülecek bir şey yapıştırın.",
      rulesTitle: "Dönüştürme kuralları",
      rules: [
        "XML öznitelikleri, <code>@</code> ile başlayan JSON anahtarları olarak yazılır, örneğin <code>\"@id\": \"7\"</code>.",
        "Öznitelik veya alt elemanlarla birlikte gelen metin <code>\"#text\"</code> altında tutulur.",
        "Tekrarlayan kardeş elemanlar JSON dizisine, diziler de tekrarlayan elemanlara dönüşür.",
        "Boş eleman <code>null</code> olur, <code>null</code> da boş eleman olur.",
        "XML değerleri metin olarak kalır. <code>&lt;age&gt;36&lt;/age&gt;</code>, <code>\"36\"</code> olur; sayı tahmini yapılmaz.",
        "Tek anahtarlı bir JSON nesnesi, o anahtarı kök eleman yapar. Aksi halde yukarıdaki kök eleman adı kullanılır.",
        "XML'deki yorumlar ve işlem talimatları yok sayılır. CDATA metin olarak korunur.",
        "Geçerli XML adı olmayan anahtarlar düzeltilir (örneğin boşluk <code>_</code> olur) ve uyarı gösterilir."
      ],
      pageTitle: "BAForge AI - JSON ↔ XML Dönüştürücü",
      historyLabel: function (d) { return (d.direction === "j2x" ? "JSON → XML: " : "XML → JSON: ") + d.input; }
    }
  };

  var T = TEXT[lang];

  var SAMPLE_JSON = JSON.stringify({
    order: {
      "@id": "A-1001",
      customer: { name: "Ayşe Yılmaz", vip: "true" },
      line: [
        { sku: "KLV-01", qty: "2" },
        { sku: "MOU-07", qty: "1" }
      ],
      note: null
    }
  }, null, 2);

  var SAMPLE_XML =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<order id="A-1001">\n' +
    "  <customer>\n    <name>Ayşe Yılmaz</name>\n    <vip>true</vip>\n  </customer>\n" +
    '  <line>\n    <sku>KLV-01</sku>\n    <qty>2</qty>\n  </line>\n' +
    '  <line>\n    <sku>MOU-07</sku>\n    <qty>1</qty>\n  </line>\n' +
    "  <note/>\n</order>";

  function $(id) { return document.getElementById(id); }

  var direction = "j2x";
  var lastOk = null;

  function setText(id, value) { var el = $(id); if (el) { el.textContent = value; } }

  function applyLanguage() {
    document.documentElement.lang = lang;
    document.title = T.pageTitle;
    setText("title", lang === "tr" ? "JSON ↔ XML Dönüştürücü" : "JSON ↔ XML Converter");
    setText("subtitle", T.subtitle);
    setText("indentLabel", T.indent);
    setText("indent2", T.indent2);
    setText("indent4", T.indent4);
    setText("indentTab", T.indentTab);
    setText("indent0", T.indent0);
    setText("rootLabel", T.root);
    setText("declLabel", T.decl);
    setText("inputTitle", T.input);
    setText("outputTitle", T.output);
    setText("convertButton", T.convert);
    setText("swapButton", T.swap);
    setText("copyButton", T.copy);
    setText("downloadButton", T.download);
    setText("sampleButton", T.sample);
    setText("clearButton", T.clear);
    setText("rulesTitle", T.rulesTitle);
    $("rulesList").innerHTML = T.rules.map(function (r) { return "<li>" + r + "</li>"; }).join("");
  }

  function setDirection(dir) {
    direction = dir;
    $("dirJ2X").setAttribute("aria-pressed", String(dir === "j2x"));
    $("dirX2J").setAttribute("aria-pressed", String(dir === "x2j"));
    $("rootField").style.display = dir === "j2x" ? "" : "none";
    $("declField").style.display = dir === "j2x" ? "" : "none";
  }

  function indentValue() {
    var v = $("indent").value;
    if (v === "tab") { return "\t"; }
    return parseInt(v, 10);
  }

  function showStatus(kind, msg) {
    var el = $("status");
    el.className = "status" + (kind ? " " + kind : "");
    el.textContent = msg || "";
    if (kind === "error") { el.setAttribute("role", "alert"); } else { el.setAttribute("role", "status"); }
  }

  function showWarnings(list) {
    $("warnings").innerHTML = (list || []).map(function (w) {
      var li = document.createElement("li");
      li.textContent = w;
      return li.outerHTML;
    }).join("");
  }

  function convert() {
    var text = $("input").value;
    showWarnings([]);
    if (!text.trim()) {
      $("output").value = "";
      lastOk = null;
      showStatus("error", T.emptyIn);
      return false;
    }
    try {
      var result = direction === "j2x"
        ? BAJsonXml.jsonToXml(text, {
            indent: indentValue(),
            rootName: $("rootName").value.trim() || "root",
            declaration: $("declaration").checked
          })
        : BAJsonXml.xmlToJson(text, { indent: indentValue() });
      $("output").value = result.output;
      showWarnings(result.warnings);
      showStatus("ok", T.done + " " + result.output.length + " " + T.chars + ".");
      lastOk = {
        direction: direction,
        input: text,
        output: result.output,
        indent: $("indent").value,
        rootName: $("rootName").value,
        declaration: $("declaration").checked
      };
      if (window.BAHistory) {
        var top = BAHistory.list("json-xml")[0];
        if (!top || top.data.input !== lastOk.input || top.data.direction !== lastOk.direction || top.data.indent !== lastOk.indent) {
          BAHistory.record();
        }
      }
      return true;
    } catch (e) {
      $("output").value = "";
      lastOk = null;
      showStatus("error", e.message || String(e));
      return false;
    }
  }

  function swap() {
    var out = $("output").value;
    if (!out) { showStatus("error", T.nothing); return; }
    $("input").value = out;
    $("output").value = "";
    setDirection(direction === "j2x" ? "x2j" : "j2x");
    showStatus("", "");
    showWarnings([]);
    lastOk = null;
  }

  function copyOutput() {
    var out = $("output").value;
    if (!out) { showStatus("error", T.nothing); return; }
    function fallback() {
      var ta = $("output");
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      showStatus(ok ? "ok" : "error", ok ? T.copied : T.copyFail);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out).then(function () {
        showStatus("ok", T.copied);
      }, fallback);
    } else {
      fallback();
    }
  }

  function download() {
    var out = $("output").value;
    if (!out) { showStatus("error", T.nothing); return; }
    var isXml = direction === "j2x";
    var blob = new Blob([out], { type: isXml ? "application/xml" : "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = isXml ? "converted.xml" : "converted.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  }

  function clearAll() {
    $("input").value = "";
    $("output").value = "";
    lastOk = null;
    showStatus("", "");
    showWarnings([]);
    $("input").focus();
  }

  applyLanguage();
  setDirection("j2x");

  $("dirJ2X").addEventListener("click", function () { setDirection("j2x"); });
  $("dirX2J").addEventListener("click", function () { setDirection("x2j"); });
  $("convertButton").addEventListener("click", convert);
  $("swapButton").addEventListener("click", swap);
  $("copyButton").addEventListener("click", copyOutput);
  $("downloadButton").addEventListener("click", download);
  $("clearButton").addEventListener("click", clearAll);
  $("sampleButton").addEventListener("click", function () {
    $("input").value = direction === "j2x" ? SAMPLE_JSON : SAMPLE_XML;
    convert();
  });
  $("input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); convert(); }
  });

  if (window.BAHistory) {
    BAHistory.init({
      page: "json-xml",
      label: function (d) { return T.historyLabel(d); },
      capture: function () { return lastOk; },
      restore: function (d) {
        setDirection(d.direction);
        $("input").value = d.input;
        $("output").value = d.output;
        $("indent").value = d.indent;
        $("rootName").value = d.rootName || "root";
        $("declaration").checked = d.declaration !== false;
        showStatus("", "");
        showWarnings([]);
        lastOk = d;
      }
    });
  }
})();
</script>

<script src="/nav.js"></script>

</body>
</html>
