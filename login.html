<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAForge AI - Sign in</title>
  <link rel="stylesheet" href="/core/tool-ui.css" />
  <style>
    .narrow { max-width: 520px; margin: 0 auto; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
    .stat { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #fbfcfe; }
    .stat b { display: block; font-size: 22px; color: var(--heading); }
    .stat span { font-size: 12px; color: var(--muted); }
    .big-input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; font: inherit; font-size: 16px; }
    @media (max-width: 500px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main class="narrow">

  <section class="hero">
    <h1 data-t="title">Sign in</h1>
    <p data-t="subtitle"></p>
  </section>

  <section class="card" id="guest" hidden>
    <label class="field">
      <span data-t="emailLabel">Email address</span>
      <input class="big-input" type="email" id="email" autocomplete="email" inputmode="email" placeholder="name@example.com" />
    </label>
    <div class="actions">
      <button type="button" class="btn primary" id="sendButton" data-t="send">Email me a sign-in link</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p style="color:var(--muted);font-size:13px;margin:12px 0 0" data-t="hint"></p>
  </section>

  <section class="card" id="member" hidden>
    <h2 id="who"></h2>
    <div class="stats">
      <div class="stat"><b id="sRole">-</b><span data-t="role">Role</span></div>
      <div class="stat"><b id="sUsed">-</b><span data-t="aiToday">AI requests today</span></div>
      <div class="stat"><b id="sLimit">-</b><span data-t="aiLimit">Daily AI limit</span></div>
    </div>
    <div class="actions">
      <a class="btn primary" href="/" style="display:inline-flex;align-items:center;text-decoration:none" data-t="toTools">Go to the tools</a>
      <a class="btn" id="adminLink" href="/admin.html" style="display:none;align-items:center;text-decoration:none" data-t="admin">Admin panel</a>
      <button type="button" class="btn" id="signOut" data-t="signOut">Sign out</button>
    </div>
    <div class="status" id="status2" role="status" aria-live="polite"></div>
  </section>

</main>

<script src="/core/tool-ui.js"></script>
<script src="/core/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = BATool.$;
  var T = BATool.applyI18n({
    en: {
      pageTitle: "BAForge AI - Sign in", title: "Sign in",
      subtitle: "No password needed. Enter your email and we send you a one-time sign-in link. New here? The same link creates your account.",
      emailLabel: "Email address", send: "Email me a sign-in link",
      hint: "Your history stays in this browser; an account lets us show your usage and keep your AI daily limit.",
      role: "Role", aiToday: "AI requests today", aiLimit: "Daily AI limit", toTools: "Go to the tools", admin: "Admin panel", signOut: "Sign out",
      sent: "Check your inbox: we sent a sign-in link to ", spam: ". It may take a minute; look in spam too.", sending: "Sending…",
      badEmail: "Enter a valid email address.", fail: "Could not send the link.", expired: "That link has expired or was already used. Request a new one.",
      signedAs: "Signed in as ", disabled: "This account is disabled. Please contact the administrator.", roleUser: "User", roleAdmin: "Admin", signedOut: "You have been signed out."
    },
    tr: {
      pageTitle: "BAForge AI - Giriş", title: "Giriş yap",
      subtitle: "Şifre gerekmez. E-postanızı yazın, size tek kullanımlık bir giriş bağlantısı gönderelim. İlk kez mi geliyorsunuz? Aynı bağlantı hesabınızı da oluşturur.",
      emailLabel: "E-posta adresi", send: "Bana giriş bağlantısı gönder",
      hint: "Geçmişiniz bu tarayıcıda kalır; hesap, kullanımınızı göstermemizi ve günlük yapay zekâ limitinizi korumamızı sağlar.",
      role: "Rol", aiToday: "Bugünkü yapay zekâ isteği", aiLimit: "Günlük yapay zekâ limiti", toTools: "Araçlara git", admin: "Yönetim paneli", signOut: "Çıkış yap",
      sent: "Gelen kutunuza bakın: şu adrese giriş bağlantısı gönderdik: ", spam: ". Bir dakika sürebilir; spam klasörüne de bakın.", sending: "Gönderiliyor…",
      badEmail: "Geçerli bir e-posta adresi girin.", fail: "Bağlantı gönderilemedi.", expired: "Bağlantının süresi dolmuş veya zaten kullanılmış. Yeni bir tane isteyin.",
      signedAs: "Giriş yapıldı: ", disabled: "Bu hesap devre dışı. Lütfen yönetici ile iletişime geçin.", roleUser: "Kullanıcı", roleAdmin: "Yönetici", signedOut: "Çıkış yaptınız."
    }
  });

  function showGuest(msg, kind) {
    $("guest").hidden = false; $("member").hidden = true;
    if (msg) { BATool.status(kind || "error", msg); }
  }

  function showMember(info) {
    $("guest").hidden = true; $("member").hidden = false;
    $("who").textContent = T.signedAs + info.email;
    $("sRole").textContent = info.role === "admin" ? T.roleAdmin : T.roleUser;
    $("sUsed").textContent = info.role === "admin" ? info.ai_used_today : info.ai_used_today;
    $("sLimit").textContent = info.role === "admin" ? "∞" : info.daily_ai_limit;
    $("adminLink").style.display = info.role === "admin" ? "inline-flex" : "none";
    if (!info.is_active) { BATool.status("error", T.disabled, "status2"); }
  }

  function boot() {
    var err = BAAuth.hashError();
    if (err && !BAAuth.isSignedIn()) { showGuest(T.expired); return; }
    if (!BAAuth.isSignedIn()) { showGuest(); return; }
    BAAuth.me(true).then(function (info) {
      if (!info) { showGuest(); return; }
      showMember(info);
    });
  }

  $("sendButton").addEventListener("click", function () {
    var email = $("email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { BATool.status("error", T.badEmail); return; }
    var b = $("sendButton"); b.disabled = true; BATool.status("", T.sending);
    BAAuth.sendLink(email).then(function (r) {
      b.disabled = false;
      if (r.ok) { BATool.status("ok", T.sent + email + T.spam); }
      else { BATool.status("error", r.error || T.fail); }
    }).catch(function () { b.disabled = false; BATool.status("error", T.fail); });
  });
  $("email").addEventListener("keydown", function (e) { if (e.key === "Enter") { $("sendButton").click(); } });
  $("signOut").addEventListener("click", function () { BAAuth.signOut(); showGuest(T.signedOut, "ok"); location.reload(); });

  boot();
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
