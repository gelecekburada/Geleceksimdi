<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAForge AI - Sign in</title>
  <link rel="stylesheet" href="/core/tool-ui.css" />
  <style>
    .narrow { max-width: 520px; margin: 0 auto; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
    .stat { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #fbfcfe; }
    .stat b { display: block; font-size: 22px; color: var(--heading); }
    .stat span { font-size: 12px; color: var(--muted); }
    .big-input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; font: inherit; font-size: 16px; }
    @media (max-width: 500px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main class="narrow">

  <section class="hero">
    <h1 data-t="title">Sign in</h1>
    <p data-t="subtitle"></p>
  </section>

  <section class="card" id="guest" hidden>
    <label class="field">
      <span data-t="emailLabel">Email address</span>
      <input class="big-input" type="email" id="email" autocomplete="email" inputmode="email" placeholder="name@example.com" />
    </label>
    <label class="field" style="margin-top:10px">
      <span data-t="pwLabel">Password</span>
      <input class="big-input" type="password" id="password" autocomplete="current-password" />
    </label>
    <div class="actions">
      <button type="button" class="btn primary" id="signInButton" data-t="signIn">Sign in</button>
      <button type="button" class="btn" id="signUpButton" data-t="signUp">Create account</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p style="color:var(--muted);font-size:13px;margin:12px 0 0" data-t="hint"></p>
  </section>

  <section class="card" id="member" hidden>
    <h2 id="who"></h2>
    <div class="stats">
      <div class="stat"><b id="sRole">-</b><span data-t="role">Role</span></div>
      <div class="stat"><b id="sUsed">-</b><span data-t="aiToday">AI requests today</span></div>
      <div class="stat"><b id="sLimit">-</b><span data-t="aiLimit">Daily AI limit</span></div>
    </div>
    <div class="actions">
      <a class="btn primary" href="/" style="display:inline-flex;align-items:center;text-decoration:none" data-t="toTools">Go to the tools</a>
      <a class="btn" id="adminLink" href="/admin.html" style="display:none;align-items:center;text-decoration:none" data-t="admin">Admin panel</a>
      <button type="button" class="btn" id="signOut" data-t="signOut">Sign out</button>
    </div>
    <div class="status" id="status2" role="status" aria-live="polite"></div>
  </section>

</main>

<script src="/core/tool-ui.js"></script>
<script src="/core/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = BATool.$;
  var T = BATool.applyI18n({
    en: {
      pageTitle: "BAForge AI - Sign in", title: "Sign in",
      subtitle: "Sign in with your email and password. New here? Choose a password (at least 8 characters) and press Create account.",
      emailLabel: "Email address", pwLabel: "Password", signIn: "Sign in", signUp: "Create account",
      hint: "Your history stays in this browser; an account lets us show your usage and keep your AI daily limit.",
      role: "Role", aiToday: "AI requests today", aiLimit: "Daily AI limit", toTools: "Go to the tools", admin: "Admin panel", signOut: "Sign out",
      working: "Please wait…", badEmail: "Enter a valid email address.", badPw: "Enter your password.", shortPw: "The password must be at least 8 characters.", fail: "Could not complete the request.", sessionLost: "Your session could not be restored. Please sign in again.", meFail: "You were signed in, but your account details could not be loaded", expired: "That link has expired or was already used. Request a new one.",
      signedAs: "Signed in as ", disabled: "This account is disabled. Please contact the administrator.", roleUser: "User", roleAdmin: "Admin", signedOut: "You have been signed out."
    },
    tr: {
      pageTitle: "BAForge AI - Giriş", title: "Giriş yap",
      subtitle: "E-posta ve şifrenizle giriş yapın. İlk kez mi geliyorsunuz? En az 8 karakterlik bir şifre belirleyip \"Hesap oluştur\"a basın.",
      emailLabel: "E-posta adresi", pwLabel: "Şifre", signIn: "Giriş yap", signUp: "Hesap oluştur",
      hint: "Geçmişiniz bu tarayıcıda kalır; hesap, kullanımınızı göstermemizi ve günlük yapay zekâ limitinizi korumamızı sağlar.",
      role: "Rol", aiToday: "Bugünkü yapay zekâ isteği", aiLimit: "Günlük yapay zekâ limiti", toTools: "Araçlara git", admin: "Yönetim paneli", signOut: "Çıkış yap",
      working: "Lütfen bekleyin…", badEmail: "Geçerli bir e-posta adresi girin.", badPw: "Şifrenizi yazın.", shortPw: "Şifre en az 8 karakter olmalı.", fail: "İşlem tamamlanamadı.", sessionLost: "Oturumunuz geri yüklenemedi. Lütfen tekrar giriş yapın.", meFail: "Giriş yapıldı ama hesap bilgileriniz alınamadı", expired: "Bağlantının süresi dolmuş veya zaten kullanılmış. Yeni bir tane isteyin.",
      signedAs: "Giriş yapıldı: ", disabled: "Bu hesap devre dışı. Lütfen yönetici ile iletişime geçin.", roleUser: "Kullanıcı", roleAdmin: "Yönetici", signedOut: "Çıkış yaptınız."
    }
  });

  function showGuest(msg, kind) {
    $("guest").hidden = false; $("member").hidden = true;
    if (msg) { BATool.status(kind || "error", msg); }
  }

  function showMember(info) {
    $("guest").hidden = true; $("member").hidden = false;
    $("who").textContent = T.signedAs + info.email;
    $("sRole").textContent = info.role === "admin" ? T.roleAdmin : T.roleUser;
    $("sUsed").textContent = info.role === "admin" ? info.ai_used_today : info.ai_used_today;
    $("sLimit").textContent = info.role === "admin" ? "∞" : info.daily_ai_limit;
    $("adminLink").style.display = info.role === "admin" ? "inline-flex" : "none";
    if (!info.is_active) { BATool.status("error", T.disabled, "status2"); }
  }

  function boot() {
    var err = BAAuth.hashError();
    if (err && !BAAuth.isSignedIn()) { showGuest(T.expired); return; }
    if (!BAAuth.isSignedIn()) { showGuest(); return; }
    /* ask /api/me directly so a failure can be named instead of silently showing the form again */
    BAAuth.getToken().then(function (tok) {
      if (!tok) { showGuest(T.sessionLost); return; }
      return fetch("/api/me", { headers: { Authorization: "Bearer " + tok } }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.ok && d && d.enabled !== false && d.email) { BAAuth.me(true).then(function (info) { if (info) { showMember(info); } else { showGuest(T.meFail + " (" + r.status + ")"); } }); return; }
          BAAuth.signOut();
          showGuest(T.meFail + " (" + r.status + (d && d.error ? ": " + d.error : "") + ")");
        });
      });
    }).catch(function () { showGuest(T.meFail); });
  }

  function submit(action) {
    var email = $("email").value.trim(), pw = $("password").value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { BATool.status("error", T.badEmail); return; }
    if (!pw) { BATool.status("error", T.badPw); return; }
    if (action === "signup" && pw.length < 8) { BATool.status("error", T.shortPw); return; }
    var bs = [$("signInButton"), $("signUpButton")]; bs.forEach(function (b) { b.disabled = true; }); BATool.status("", T.working);
    BAAuth.credentials(action, email, pw).then(function (r) {
      bs.forEach(function (b) { b.disabled = false; });
      if (r.ok) { location.reload(); } else { BATool.status("error", r.error || T.fail); }
    }).catch(function () { bs.forEach(function (b) { b.disabled = false; }); BATool.status("error", T.fail); });
  }
  $("signInButton").addEventListener("click", function () { submit("signin"); });
  $("signUpButton").addEventListener("click", function () { submit("signup"); });
  $("password").addEventListener("keydown", function (e) { if (e.key === "Enter") { submit("signin"); } });
  $("email").addEventListener("keydown", function (e) { if (e.key === "Enter") { $("password").focus(); } });
  $("signOut").addEventListener("click", function () { BAAuth.signOut(); showGuest(T.signedOut, "ok"); location.reload(); });

  boot();
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
